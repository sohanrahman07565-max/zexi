services:
  - type: web
    name: telegram-group-file-bot
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ROOT_ADMIN_ID
        sync: false
      - key: ADMIN_NAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_FILE_PATH
        value: .data/store.json
