<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Panel – Zexi</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07060f;--card:rgba(24,24,40,.62);--text:#fff;--muted:#8d8ca6;--pink:#e879b9;--violet:#a78bfa;--blue:#60a5fa;--green:#34d399}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.liquid{position:fixed;inset:0;filter:url(#goo);z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-10vmax;background:radial-gradient(circle,#b0204a,#4b0f2b 70%)}
.b2{width:40vmax;height:40vmax;right:-12vmax;bottom:-8vmax;background:radial-gradient(circle,#5b2bd6,#1d1250 70%);animation-duration:22s}
.b3{width:26vmax;height:26vmax;left:35%;top:55%;background:radial-gradient(circle,#0e7fd8,#0a2a5a 70%);animation-duration:26s;opacity:.5}
.b4{width:20vmax;height:20vmax;right:20%;top:6%;background:radial-gradient(circle,#c026d3,#4a0a5a 70%);animation-duration:20s;opacity:.5}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.18)}100%{transform:translate(-5vmax,10vmax) scale(.92)}}
.dots{position:fixed;inset:0;z-index:1;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:26px 26px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 80%);pointer-events:none}
.card{position:relative;z-index:2;width:min(92vw,400px);margin:16px;padding:34px 26px 26px;border-radius:34px;background:var(--card);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);animation:rise .9s cubic-bezier(.2,.9,.25,1) both;transform-style:preserve-3d;transition:transform .15s ease-out}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a,0deg),#e879b9,#a78bfa,#60a5fa,#34d399,#e879b9);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.logo{position:relative;width:78px;height:78px;margin:0 auto 18px;animation:float 4.5s ease-in-out infinite}
.logo img{width:100%;height:100%;border-radius:22px;display:block;position:relative;z-index:1;box-shadow:0 8px 30px rgba(168,85,247,.5)}
.logo::before,.logo::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px solid var(--violet);opacity:0;animation:ring 3s ease-out infinite}
.logo::after{animation-delay:1.5s;border-color:var(--pink)}
@keyframes ring{0%{transform:scale(.95);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes float{50%{transform:translateY(-7px)}}
h1{margin:0;text-align:center;font-size:27px;letter-spacing:.09em;font-weight:800;background:linear-gradient(90deg,#fff,#d8c8ff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.sub{text-align:center;margin:10px 0 28px;font-size:12.5px;letter-spacing:.3em;color:var(--muted);font-weight:600}
label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:#c9c8de;margin:0 0 9px 2px}
.field{position:relative;margin-bottom:20px;opacity:0;animation:rise .7s .35s cubic-bezier(.2,.9,.25,1) forwards}
.field:nth-of-type(2){animation-delay:.5s}
.box{position:relative;display:flex;align-items:center;height:56px;border-radius:18px;background:rgba(8,8,20,.7);border:1px solid rgba(255,255,255,.08);transition:border-color .25s,box-shadow .25s,transform .25s;overflow:hidden}
.box:focus-within{border-color:rgba(167,139,250,.8);box-shadow:0 0 0 4px rgba(167,139,250,.15),0 0 28px rgba(168,85,247,.35);transform:translateY(-1px)}
.box::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--pink),var(--blue),var(--green));transition:width .5s}
.box:focus-within::after{width:100%}
.spg{flex:none;width:30px;height:30px;margin:0 12px 0 14px;border-radius:10px;display:grid;place-items:center;font-size:9.5px;font-weight:900;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 4px 14px rgba(168,85,247,.5);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.box:focus-within .spg{transform:rotate(-8deg) scale(1.12)}
input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding-right:14px}
input::placeholder{color:#6f6e88}
.toggle{flex:none;border:0;background:none;color:var(--violet);font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;padding:0 16px;height:100%;cursor:pointer;min-width:62px;transition:color .2s,text-shadow .2s}
.toggle:hover{color:#fff;text-shadow:0 0 12px var(--violet)}
.toggle.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
.signin{position:relative;width:100%;height:56px;border:0;border-radius:18px;color:#fff;font:inherit;font-size:16px;font-weight:800;letter-spacing:.12em;cursor:pointer;overflow:hidden;background:linear-gradient(110deg,#e879b9,#a78bfa,#ec4899,#e879b9);background-size:250% 100%;animation:flow 6s linear infinite,rise .7s .65s both;box-shadow:0 10px 30px rgba(236,72,153,.35);transition:transform .2s,box-shadow .3s;display:flex;align-items:center;justify-content:center;gap:10px}
@keyframes flow{to{background-position:-250% 0}}
.signin:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(236,72,153,.5)}
.signin:active{transform:scale(.98)}
.signin svg{transition:transform .3s}
.signin:hover svg{transform:translateX(5px)}
.signin::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{60%,100%{left:130%}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.signin.load span{opacity:.0}
.signin.load::after{content:"";width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;position:absolute;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.err{max-height:0;overflow:hidden;opacity:0;color:#ff6b81;font-size:13px;font-weight:600;letter-spacing:.03em;margin:0 0 0 4px;transition:max-height .35s,opacity .35s,margin .35s}
.err.show{max-height:30px;opacity:1;margin-top:9px}
.box.bad{border-color:rgba(255,107,129,.9);box-shadow:0 0 0 4px rgba(255,107,129,.14),0 0 26px rgba(255,80,110,.35)}
.box.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.google{display:block;margin:20px auto 0;width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .3s;animation:rise .7s .8s both}
.google svg{width:100%;height:100%;display:block}
.google:hover{transform:scale(1.2) rotate(-6deg);filter:drop-shadow(0 0 14px rgba(96,165,250,.7))}
.google:active{transform:scale(.92)}
.foot{margin-top:22px;padding-top:20px;border-top:1px solid;border-image:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent) 1;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.28em;background:linear-gradient(90deg,var(--pink),var(--blue),var(--green),var(--pink));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
.foot-wrap{margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:18px}
.foot{margin:0;padding:0;border:0}
body:not(.go) .card,body:not(.go) .card *,body:not(.go) .card::before,body:not(.go) .card *::before,body:not(.go) .card *::after{animation-play-state:paused}
.intro{position:fixed;inset:0;z-index:50;pointer-events:none}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background-color:#07060f;background-image:radial-gradient(ellipse at 30% 20%,rgba(176,32,74,.45),transparent 55%),radial-gradient(ellipse at 75% 85%,rgba(91,43,214,.45),transparent 55%);background-size:200% 100%}
.half.l{left:0;background-position:left center;animation:openL .95s cubic-bezier(.77,0,.18,1) 2.5s forwards}
.half.r{right:0;background-position:right center;animation:openR .95s cubic-bezier(.77,0,.18,1) 2.5s forwards}
.zx{position:absolute;top:50%;width:100vw;text-align:center;font-size:clamp(60px,24vw,150px);font-weight:900;letter-spacing:.16em;padding-left:.16em;line-height:1;margin-top:-.5em;background:linear-gradient(100deg,#e879b9,#a78bfa,#60a5fa,#34d399,#e879b9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(168,85,247,.6));animation:zin 1.5s cubic-bezier(.2,.9,.25,1) both,flow 4s linear infinite}
.half.l .zx{left:0}
.half.r .zx{left:-50vw}
@keyframes zin{from{opacity:0;transform:scale(1.5);filter:blur(24px) drop-shadow(0 0 0 transparent)}to{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 0 22px rgba(168,85,247,.6))}}
@keyframes openL{to{transform:translateX(-101%)}}
@keyframes openR{to{transform:translateX(101%)}}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(transparent,#fff,#a78bfa,transparent);box-shadow:0 0 24px 6px rgba(168,85,247,.7);transform:scaleY(0);opacity:0;animation:seam 1s ease-in-out 1.7s forwards}
@keyframes seam{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.bar{position:absolute;left:50%;bottom:24%;width:150px;height:4px;margin-left:-75px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;animation:fade .4s ease 2.2s forwards}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#e879b9,#60a5fa,#34d399);animation:fill 2.1s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes fill{to{width:100%}}
@keyframes fade{to{opacity:0}}
.intro{background:radial-gradient(ellipse at 25% 20%,rgba(176,32,74,.45),transparent 55%),radial-gradient(ellipse at 80% 85%,rgba(91,43,214,.45),transparent 55%),#07060f;animation:introout .8s ease 2.9s forwards}
@keyframes introout{to{opacity:0}}
.zwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.04em;font-size:clamp(90px,34vw,190px);font-weight:900;line-height:1}
.zl,.zr{display:block;background:linear-gradient(100deg,#e879b9,#a78bfa,#60a5fa,#34d399,#e879b9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.zl{animation:zin 1.4s cubic-bezier(.2,.9,.25,1) both,flow 4s linear infinite,vanL .95s cubic-bezier(.5,0,.8,.4) 2.3s forwards}
.zr{animation:zin 1.4s cubic-bezier(.2,.9,.25,1) .1s both,flow 4s linear infinite,vanR .95s cubic-bezier(.5,0,.8,.4) 2.3s forwards}
@keyframes vanL{from{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 22px rgba(168,85,247,.6))}to{opacity:0;transform:translateX(-46vw) scale(.4);filter:blur(16px) drop-shadow(0 0 34px rgba(168,85,247,.9))}}
@keyframes vanR{from{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 22px rgba(168,85,247,.6))}to{opacity:0;transform:translateX(46vw) scale(.4);filter:blur(16px) drop-shadow(0 0 34px rgba(168,85,247,.9))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
(function(){
  var p=document.getElementById('p'),t=document.getElementById('t'),s=document.getElementById('s'),card=document.getElementById('card');
  setTimeout(function(){document.body.classList.add('go');},2900);
  setTimeout(function(){var i=document.getElementById('intro');if(i)i.style.display='none';},3900);
  /* DEMO ONLY: replace with a real server-side check */
  var CRED={user:'admin',pass:'zexi123'};
  function clearErr(inp,eid){var b=inp.closest('.box');b.classList.remove('bad','shake');document.getElementById(eid).classList.remove('show');}
  function fail(inp,eid,msg){
    clearErr(inp,eid);
    var b=inp.closest('.box'),e=document.getElementById(eid);
    e.textContent=msg;e.classList.add('show');void b.offsetWidth;b.classList.add('bad','shake');inp.focus();
  }
  document.getElementById('u').addEventListener('input',function(){clearErr(this,'ue');});
  p.addEventListener('input',function(){clearErr(p,'pe');});
  t.addEventListener('click',function(){
    var show=p.type==='password';
    p.type=show?'text':'password';
    t.textContent=show?'Hide':'Show';
    t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');
  });
  s.addEventListener('click',function(e){
    var r=s.getBoundingClientRect(),d=Math.max(r.width,r.height),i=document.createElement('i');
    i.className='ripple';i.style.width=i.style.height=d+'px';
    i.style.left=(e.clientX-r.left-d/2)+'px';i.style.top=(e.clientY-r.top-d/2)+'px';
    s.appendChild(i);setTimeout(function(){i.remove()},700);
    s.classList.add('load');
    setTimeout(function(){
      s.classList.remove('load');
      var u=document.getElementById('u');
      var uv=u.value.trim(),pv=p.value;
      if(!uv&&!pv){
        fail(p,'pe','');document.getElementById('pe').classList.remove('show');
        fail(u,'ue','Please enter your username and password');return;
      }
      if(!uv){fail(u,'ue','Please enter your username');return;}
      if(!pv){fail(p,'pe','Please enter your password');return;}
      if(uv.toLowerCase()!==CRED.user){fail(u,'ue','Incorrect username');return;}
      if(p.value!==CRED.pass){fail(p,'pe','Incorrect password');return;}
      s.querySelector('span').textContent='WELCOME';
    },1000);
  });
  if(window.matchMedia('(hover:hover)').matches){
    document.addEventListener('mousemove',function(e){
      var x=(e.clientX/innerWidth-.5)*8,y=(e.clientY/innerHeight-.5)*-8;
      card.style.transform='perspective(900px) rotateY('+x+'deg) rotateX('+y+'deg)';
    });
  }
})();
</script>
</body>
</html>
